<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELA - Test Interfaccia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        button { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        input[type="file"], input[type="text"] { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 14px; }
        .note-card { background: #fafafa; border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .highlight { color: #d35400; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>TELA - Test API</h1>

    <!-- SEZIONE UPLOAD -->
    <div class="section">
        <h2>1. Carica Appunto</h2>
        <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.jpg,.jpeg,.png,.webp">
        <button onclick="uploadFile()">Carica File</button>
        <pre id="uploadResult">Risultato upload...</pre>
    </div>

    <!-- SEZIONE RICERCA -->
    <div class="section">
        <h2>2. Cerca (Fuzzy Search)</h2>
        <input type="text" id="searchInput" placeholder="Cerca nel testo estratto...">
        <button onclick="searchNotes()">Cerca</button>
        <div id="searchResult"></div>
    </div>

    <!-- SEZIONE LISTA -->
    <div class="section">
        <h2>3. Ultimi Appunti</h2>
        <button onclick="fetchNotes()">Aggiorna Lista</button>
        <div id="notesList"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8000/api";

    // 1. UPLOAD FILE
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("Seleziona un file prima!"); return;
        }
        
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        document.getElementById('uploadResult').innerText = "Caricamento in corso...";

        try {
            const response = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
            const data = await response.json();
            document.getElementById('uploadResult').innerText = JSON.stringify(data, null, 2);
            fetchNotes(); // Aggiorna la lista dopo l'upload
        } catch (error) {
            document.getElementById('uploadResult').innerText = "Errore: " + error;
        }
    }

    // 2. RICERCA
    async function searchNotes() {
        const q = document.getElementById('searchInput').value;
        if (q.length < 2) {
            alert("Inserisci almeno 2 caratteri"); return;
        }

        const resultDiv = document.getElementById('searchResult');
        resultDiv.innerHTML = "Ricerca in corso...";

        try {
            const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
            const data = await response.json();
            
            if (data.results && data.results.length > 0) {
                resultDiv.innerHTML = data.results.map(hit => `
                    <div class="note-card">
                        <strong>${hit.filename}</strong> (ID: ${hit.id})<br>
                        <p>${hit._formatted ? hit._formatted.extracted_text : hit.extracted_text}</p>
                    </div>
                `).join('');
            } else {
                resultDiv.innerHTML = "<p>Nessun risultato trovato.</p>";
            }
        } catch (error) {
            resultDiv.innerHTML = "Errore: " + error;
        }
    }

    // 3. LISTA APPUNTI
    async function fetchNotes() {
        const listDiv = document.getElementById('notesList');
        listDiv.innerHTML = "Caricamento lista...";

        try {
            const response = await fetch(`${API_BASE}/notes`);
            const data = await response.json();
            
            if (data.items && data.items.length > 0) {
                listDiv.innerHTML = data.items.map(note => `
                    <div class="note-card">
                        <strong>${note.filename}</strong> - Stato: <span class="highlight">${note.status}</span><br>
                        <small>Data: ${note.created_at}</small>
                    </div>
                `).join('');
            } else {
                listDiv.innerHTML = "<p>Nessun appunto nel database.</p>";
            }
        } catch (error) {
            listDiv.innerHTML = "Errore: " + error;
        }
    }

    // Carica la lista all'avvio
    window.onload = fetchNotes;
</script>

</body>
</html>
